$kind: http-request
url: "{{baseUrl}}/api/chat/sessions/{{sessionId2}}/messages"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token2}}
body:
  type: text
  content: |-
    {
      "content": "Change my appointment to 4 PM."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Ambiguous modification is safely clarified', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Assistant asks which appointment', () => pm.expect(json.data.action).to.eql('ask_more'));
      pm.test('Assistant mentions multiple appointments', () => pm.expect(json.data.message.content.toLowerCase()).to.include('multiple appointments'));
    language: text/javascript
order: 22000
name: Chat - Ask Which Appointment
