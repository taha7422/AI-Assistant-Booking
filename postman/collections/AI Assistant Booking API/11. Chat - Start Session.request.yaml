$kind: http-request
url: "{{baseUrl}}/api/chat/sessions"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "title": "Postman Chat Session"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      if (json.data && json.data.id) {
          pm.environment.set('sessionId', json.data.id);
          pm.collectionVariables.set('sessionId', json.data.id);
          pm.test('Assistant initial greeting sent', () => pm.expect(json.data.messages.length).to.be.above(0));
      }
    language: text/javascript
order: 11000
