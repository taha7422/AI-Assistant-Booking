$kind: http-request
url: "{{baseUrl}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "serviceId": "{{serviceId}}",
      "startsAt": "{{slotTime}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      if (json.data && json.data.id) {
          pm.environment.set('appointmentId', json.data.id);
          pm.collectionVariables.set('appointmentId', json.data.id);
          pm.test('Status is booked', () => pm.expect(json.data.status).to.eql('booked'));
      }
    language: text/javascript
order: 8000
